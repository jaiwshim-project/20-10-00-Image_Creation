<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 클릭 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 1rem;
        }

        .info-box {
            background: #ecf0f1;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            border-left: 4px solid #2563eb;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
            box-shadow: 0 8px 12px rgba(37, 99, 235, 0.1);
        }

        .card.selected {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
        }

        .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .card-name {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.875rem;
            color: #666;
        }

        .selected .card-desc {
            color: rgba(255,255,255,0.9);
        }

        .console {
            background: #1e1e1e;
            color: #00ff00;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 2rem;
        }

        .console-line {
            margin: 0.25rem 0;
            white-space: pre-wrap;
        }

        .console-success {
            color: #00ff00;
        }

        .console-info {
            color: #00ccff;
        }

        .console-error {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 카드 클릭 이벤트 델리게이션 테스트</h1>

        <div class="info-box">
            <strong>📋 테스트 목적:</strong><br>
            이벤트 델리게이션 방식으로 카드 클릭이 제대로 작동하는지 확인합니다.
            아래 카드를 클릭해보세요. 콘솔에 메시지가 표시됩니다.
        </div>

        <h2>테스트 카드</h2>
        <div class="card-grid" id="card-container">
            <!-- 카드들이 JavaScript로 생성됨 -->
        </div>

        <h2>콘솔 출력</h2>
        <div class="console" id="console-output"></div>
    </div>

    <script>
        class Logger {
            constructor() {
                this.logs = [];
            }

            log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const fullMessage = `[${timestamp}] ${message}`;
                this.logs.push({ message: fullMessage, type });
                this.render();
                console.log(message);
            }

            render() {
                const output = document.getElementById('console-output');
                output.innerHTML = this.logs
                    .map(log => `<div class="console-line console-${log.type}">${log.message}</div>`)
                    .join('');
                output.scrollTop = output.scrollHeight;
            }
        }

        const logger = new Logger();

        logger.log('테스트 페이지 로드됨', 'success');

        // 테스트 데이터
        const testCards = [
            { id: 1, emoji: '💻', name: '기술/IT', desc: '디지털 혁신' },
            { id: 2, emoji: '💰', name: '금융/뱅킹', desc: '신뢰와 안정' },
            { id: 3, emoji: '🏥', name: '의료/헬스', desc: '건강과 웰빙' },
            { id: 4, emoji: '📚', name: '교육/학습', desc: '교육 플랫폼' },
        ];

        // 카드 생성
        const container = document.getElementById('card-container');
        testCards.forEach(card => {
            const div = document.createElement('div');
            div.className = 'card';
            div.setAttribute('data-card-id', card.id);
            div.setAttribute('data-card-name', card.name);
            div.innerHTML = `
                <div class="card-emoji">${card.emoji}</div>
                <div class="card-name">${card.name}</div>
                <div class="card-desc">${card.desc}</div>
            `;
            container.appendChild(div);
        });

        logger.log(`${testCards.length}개 카드 생성됨`, 'success');

        // 이벤트 델리게이션 설정
        container.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card) {
                const cardId = card.getAttribute('data-card-id');
                const cardName = card.getAttribute('data-card-name');

                logger.log(`✅ 카드 클릭 감지: ${cardName} (ID: ${cardId})`, 'success');

                // 선택 표시
                document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            }
        });

        logger.log('✅ 이벤트 델리게이션 설정 완료', 'success');
        logger.log('👉 아래 카드를 클릭해보세요', 'info');

        // 페이지 준비 완료
        window.addEventListener('load', () => {
            logger.log('🎯 페이지 완전히 로드됨 - 준비 완료!', 'success');
        });
    </script>
</body>
</html>
